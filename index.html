<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إعلانات Fawakih AI</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #9D4EDD; margin-bottom: 20px; }
        label { display: block; text-align: right; margin: 10px 5px 5px; font-weight: bold; font-size: 14px; }
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #9D4EDD; }
        button {
            background-color: #9D4EDD;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background-color: #7b2cbf; }
        
        /* شريط التقدم */
        #progressContainer {
            display: none;
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        #progressBar {
            width: 0%;
            height: 10px;
            background-color: #9D4EDD;
            transition: width 0.2s;
        }
        #status { margin-top: 15px; font-weight: bold; font-size: 14px; line-height: 1.6; }
        .code-box { background: #f8f9fa; border: 1px dashed #9D4EDD; padding: 10px; margin-top: 10px; border-radius: 8px; font-family: monospace; font-size: 16px; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة الإعلانات عبر تليجرام 🚀</h2>
    
    <label>اختر صورة أو فيديو:</label>
    <input type="file" id="mediaFile" accept="image/*,video/*">
    
    <label>مدة الإعلان (بالثواني):</label>
    <input type="number" id="adDuration" placeholder="مثال: 5" value="5" min="1">
    
    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <button onclick="uploadAd()" id="sendBtn">رفع وإرسال إلى تليجرام</button>
    
    <div id="status"></div>
</div>

<script>
    // إعدادات Firebase الخاصة بك (نستخدمها فقط لرفع الملف وإنشاء الرابط)
    const firebaseConfig = {
        apiKey: "AIzaSyDr0kbQDE90hhEMohV6X1b4ndu4L7uZz24",
        databaseURL: "https://mehamzaalanat-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "mehamzaalanat",
        storageBucket: "mehamzaalanat.firebasestorage.app"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const storage = firebase.storage();

    function uploadAd() {
        const fileInput = document.getElementById('mediaFile');
        const durationInput = document.getElementById('adDuration').value;
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('sendBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        if (fileInput.files.length === 0) {
            statusDiv.innerHTML = "<span style='color:red;'>⚠️ يرجى اختيار ملف أولاً!</span>";
            return;
        }

        const file = fileInput.files[0];
        const fileName = "ads/" + Date.now() + "_" + file.name;

        btn.disabled = true;
        progressContainer.style.display = "block";
        progressBar.style.width = "0%";
        statusDiv.innerHTML = "جاري رفع الملف وإنشاء الرابط... ⏳";

        const storageRef = storage.ref(fileName);
        const uploadTask = storageRef.put(file);

        uploadTask.on('state_changed', 
            (snapshot) => {
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                progressBar.style.width = progress + "%";
            }, 
            (error) => {
                console.error(error);
                statusDiv.innerHTML = "<span style='color:red;'>❌ فشل الرفع! تأكد من إعدادات الحماية.</span>";
                btn.disabled = false;
            }, 
            () => {
                uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                    statusDiv.innerHTML = "جاري الإرسال إلى تليجرام... 🚀";
                    
                    // 1. توليد رمز الإعلان (74 + رقمين عشوائيين)
                    const randomLastTwo = Math.floor(10 + Math.random() * 90); // من 10 إلى 99
                    const secretCode = "74" + randomLastTwo;

                    // 2. تجهيز النص بالصيغة التي سيفهمها التطبيق (الرابط,المدة,الرمز)
                    const messageText = `${downloadURL},${durationInput},${secretCode}`;

                    // 3. إرسال الرسالة إلى تليجرام
                    const botToken = "7894436976:AAFdg77dpzCgpeLnkwAQqP9POkwZMwWoikg";
                    const chatId = "5998250367";
                    const tgUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(messageText)}`;

                    fetch(tgUrl)
                    .then(response => response.json())
                    .then(data => {
                        if(data.ok) {
                            statusDiv.innerHTML = `
                                <span style='color:green;'>✅ تم نشر الإعلان وإرساله لتليجرام بنجاح!</span>
                                <div class="code-box">الرمز المولد: <b>${secretCode}</b><br><br>⚠️ تذكر: لكي يقرأ التطبيق هذا الإعلان، قم بنسخ الرسالة التي وصلتك من البوت وأعد إرسالها إليه مرة أخرى.</div>
                            `;
                            btn.disabled = false;
                            setTimeout(() => { progressContainer.style.display = "none"; }, 3000);
                        } else {
                            statusDiv.innerHTML = "<span style='color:red;'>❌ حدث خطأ أثناء الإرسال لتليجرام.</span>";
                            btn.disabled = false;
                        }
                    })
                    .catch(error => {
                        statusDiv.innerHTML = "<span style='color:red;'>❌ فشل الاتصال بتليجرام.</span>";
                        btn.disabled = false;
                    });
                });
            }
        );
    }
</script>

</body>
</html>
