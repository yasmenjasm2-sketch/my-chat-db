<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Ad Experience</title>
    <style>
        :root {
            --primary-color: #9D4EDD;
            --accent-color: #5A189A;
            --bg-overlay: rgba(10, 10, 10, 0.85);
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0;
        }
        body {
            background-color: transparent;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
        }
        
        .ad-wrapper {
            position: relative; width: 95%; height: 90%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: var(--bg-overlay);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0; transform: scale(0.9);
            animation: emerge 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes emerge {
            to { opacity: 1; transform: scale(1); }
        }

        /* شريط التقدم العلوي (25 ثانية) */
        .progress-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: rgba(255, 255, 255, 0.1); border-radius: 20px 20px 0 0;
            overflow: hidden; z-index: 30;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, var(--primary-color), #E0AAFF);
            width: 0%; animation: adTimer 25s linear forwards;
            box-shadow: 0 0 10px var(--primary-color);
        }
        @keyframes adTimer { to { width: 100%; } }

        /* حاوية الميديا */
        .media-container {
            width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center;
            padding: 10px; position: relative;
        }
        img, video {
            max-width: 100%; max-height: 100%;
            border-radius: 12px; object-fit: contain;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* لودر للتحميل الضعيف */
        .loader {
            position: absolute; width: 40px; height: 40px;
            border: 3px solid rgba(157, 78, 221, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* الملصق */
        .info-tag {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.5); padding: 5px 15px;
            border-radius: 50px; color: #fff; font-size: 11px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="ad-wrapper" id="mainAd">
        <div class="progress-container">
            <div class="progress-fill"></div>
        </div>
        
        <div class="media-container" id="mediaBox">
            <div class="loader" id="spinner"></div>
            <!-- المحتوى سيحقن هنا -->
        </div>

        <div class="info-tag">إعلان مميز ✨</div>
    </div>

    <script src="config.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const mediaBox = document.getElementById('mediaBox');
            const spinner = document.getElementById('spinner');

            if (typeof adConfig !== 'undefined' && adConfig.isActive) {
                let mediaHtml = '';
                
                if (adConfig.type === 'video') {
                    mediaHtml = `<video id="adContent" src="${adConfig.fileName}" autoplay loop playsinline muted></video>`;
                } else {
                    mediaHtml = `<img id="adContent" src="${adConfig.fileName}" alt="Ad">`;
                }

                // إضافة رابط إذا وجد
                if (adConfig.link) {
                    mediaBox.innerHTML += `<a href="${adConfig.link}" target="_blank" style="display:contents;">${mediaHtml}</a>`;
                } else {
                    mediaBox.innerHTML += mediaHtml;
                }

                const content = document.getElementById('adContent');
                content.onload = content.onloadeddata = () => spinner.style.display = 'none';
            } else {
                document.body.style.display = 'none';
            }
        });
    </script>
</body>
</html>
