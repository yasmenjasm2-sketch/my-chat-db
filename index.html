<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Ad Viewer</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; background-color: transparent; display: flex;
            justify-content: center; align-items: center; height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        
        /* شاشة التحميل للإنترنت الضعيف */
        .loader-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; z-index: 50;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(157, 78, 221, 0.3);
            border-top-color: #9D4EDD; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .ad-container {
            position: relative; width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center; background: transparent;
            opacity: 0; transition: opacity 0.5s ease;
        }
        
        /* شريط تقدم احترافي */
        .progress-bar {
            position: absolute; top: 0; left: 0; height: 4px; background: #9D4EDD;
            width: 0%; z-index: 20; box-shadow: 0 0 10px #9D4EDD;
        }
        @keyframes loadProgress { to { width: 100%; } }

        img, video {
            max-width: 100%; max-height: 100%; object-fit: contain;
            pointer-events: auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .ad-badge {
            position: absolute; bottom: 25px; left: 20px;
            background: rgba(20, 20, 20, 0.75); backdrop-filter: blur(10px);
            color: #FFF; padding: 8px 18px; border-radius: 20px;
            font-family: sans-serif; font-size: 13px; font-weight: bold;
            border: 1px solid rgba(157, 78, 221, 0.5);
            pointer-events: none; z-index: 10;
        }
        .hidden { display: none !important; }
        .visible { opacity: 1 !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="loader-container" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="ad-container" id="adContainer"></div>

    <script src="config.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('adContainer');
            const loader = document.getElementById('loader');

            if (typeof adConfig !== 'undefined' && adConfig.isActive) {
                let mediaElement = '';
                
                if (adConfig.type === 'video') {
                    mediaElement = `<video id="adMedia" src="${adConfig.fileName}" autoplay playsinline disablepictureinpicture controlslist="nodownload"></video>`;
                } else {
                    mediaElement = `<img id="adMedia" src="${adConfig.fileName}" alt="Ad">`;
                }

                const innerContent = `
                    <div class="progress-bar" id="progressBar"></div>
                    ${mediaElement}
                    <div class="ad-badge">إعلان ممول 📢</div>
                `;

                if (adConfig.link && adConfig.link.trim() !== "") {
                    container.innerHTML = `<a href="${adConfig.link}" target="_blank" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; text-decoration:none;">${innerContent}</a>`;
                } else {
                    container.innerHTML = innerContent;
                }

                const media = document.getElementById('adMedia');
                const progressBar = document.getElementById('progressBar');

                // الانتظار حتى يصبح الميديا جاهزاً للعرض (يحل مشكلة الإنترنت الضعيف)
                const onMediaReady = () => {
                    loader.classList.add('hidden');
                    container.classList.add('visible');
                    
                    // تشغيل شريط التقدم بناءً على الوقت القادم من config
                    progressBar.style.animation = `loadProgress ${adConfig.maxDuration}s linear forwards`;

                    // إرسال الأوامر لتطبيق الأندرويد لبدء العدادات
                    if (window.AndroidBridge) {
                        window.AndroidBridge.startAdTimers(adConfig.maxDuration, adConfig.skipTime);
                    }
                };

                if (adConfig.type === 'video') {
                    media.oncanplay = onMediaReady;
                    media.onerror = onMediaReady; // في حال فشل التحميل، نعرضه لكي يتمكن المستخدم من التخطي
                } else {
                    media.onload = onMediaReady;
                    media.onerror = onMediaReady;
                }

            } else {
                document.body.style.display = 'none';
                if (window.AndroidBridge) window.AndroidBridge.closeAd();
            }
        });
    </script>
</body>
</html>
