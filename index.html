<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إعلانات Fawakih AI</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #9D4EDD; margin-bottom: 20px; }
        input[type="file"], input[type="number"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            background-color: #9D4EDD;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover { background-color: #7b2cbf; }
        .btn-delete { background-color: #D32F2F; }
        .btn-delete:hover { background-color: #b71c1c; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة الإعلانات 🚀</h2>
    
    <label>اختر صورة أو فيديو:</label>
    <input type="file" id="mediaFile" accept="image/*,video/*">
    
    <label>مدة الإعلان (بالثواني):</label>
    <input type="number" id="adDuration" placeholder="مثال: 5" value="5" min="1">
    
    <button onclick="uploadAd()" id="sendBtn">نشر الإعلان للتطبيق</button>
    <button onclick="deleteAd()" class="btn-delete" id="deleteBtn">إيقاف/حذف الإعلان الحالي</button>
    
    <div id="status"></div>
</div>

<script>
    // إعدادات مشروعك
    const firebaseConfig = {
        apiKey: "AIzaSyDr0kbQDE90hhEMohV6X1b4ndu4L7uZz24",
        databaseURL: "https://mehamzaalanat-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "mehamzaalanat",
        storageBucket: "mehamzaalanat.firebasestorage.app"
    };

    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();
    const database = firebase.database();

    async function uploadAd() {
        const fileInput = document.getElementById('mediaFile');
        const durationInput = document.getElementById('adDuration').value;
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('sendBtn');

        if (fileInput.files.length === 0) {
            statusDiv.innerHTML = "<span style='color:red;'>يرجى اختيار ملف أولاً!</span>";
            return;
        }

        const file = fileInput.files[0];
        const isVideo = file.type.startsWith('video/');
        const fileName = "ads/" + Date.now() + "_" + file.name;

        btn.disabled = true;
        btn.innerText = "جاري الرفع...";
        statusDiv.innerHTML = "<span style='color:blue;'>جاري رفع الملف إلى الخوادم... ⏳</span>";

        try {
            // 1. رفع الملف إلى Firebase Storage
            const storageRef = storage.ref(fileName);
            const snapshot = await storageRef.put(file);
            const downloadURL = await snapshot.ref.getDownloadURL();

            // 2. تحديث قاعدة البيانات بالإعلان النشط
            await database.ref('active_ad').set({
                mediaUrl: downloadURL,
                isVideo: isVideo,
                duration: parseInt(durationInput),
                timestamp: Date.now()
            });

            statusDiv.innerHTML = "<span style='color:green;'>تم نشر الإعلان للمستخدمين بنجاح! ✅</span>";
        } catch (error) {
            console.error(error);
            statusDiv.innerHTML = "<span style='color:red;'>حدث خطأ أثناء الرفع! تأكد من صلاحيات Firebase.</span>";
        } finally {
            btn.disabled = false;
            btn.innerText = "نشر الإعلان للتطبيق";
        }
    }

    async function deleteAd() {
        const statusDiv = document.getElementById('status');
        if(confirm("هل أنت متأكد أنك تريد إيقاف الإعلان الحالي من التطبيق؟")) {
            try {
                await database.ref('active_ad').remove();
                statusDiv.innerHTML = "<span style='color:green;'>تم إيقاف وحذف الإعلان بنجاح! ❌</span>";
            } catch(e) {
                statusDiv.innerHTML = "<span style='color:red;'>حدث خطأ أثناء الحذف!</span>";
            }
        }
    }
</script>

</body>
</html>
