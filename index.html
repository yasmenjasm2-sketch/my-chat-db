<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Viewer</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: transparent; display: flex;
            justify-content: center; align-items: center; height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        .ad-container {
            position: relative; width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center; background: #000;
        }
        img, video {
            max-width: 100%; max-height: 100%; object-fit: contain;
            pointer-events: auto; /* السماح بالنقر لفتح الرابط */
        }
        .ad-badge {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            color: white; padding: 5px 12px; border-radius: 20px;
            font-family: sans-serif; font-size: 12px; border: 1px solid rgba(255,255,255,0.3);
            pointer-events: none; z-index: 10;
        }
        /* تصميم زر الإغلاق إذا كان الإعلان غير نشط */
        .hidden { display: none !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="ad-container hidden" id="adContainer">
        </div>

    <script src="config.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('adContainer');

            // التحقق مما إذا كان الإعلان مفعلاً في ملف config.js
            if (typeof adConfig !== 'undefined' && adConfig.isActive) {
                container.classList.remove('hidden');
                
                let mediaElement = '';
                
                if (adConfig.type === 'video') {
                    mediaElement = `<video src="${adConfig.fileName}" autoplay muted loop playsinline></video>`;
                } else {
                    mediaElement = `<img src="${adConfig.fileName}" alt="Ad">`;
                }

                // إضافة رابط النقر إذا كان موجوداً
                if (adConfig.link && adConfig.link.trim() !== "") {
                    container.innerHTML = `
                        <a href="${adConfig.link}" target="_blank" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; text-decoration:none;">
                            ${mediaElement}
                        </a>
                        <div class="ad-badge">إعلان ممول 📢</div>
                    `;
                } else {
                    container.innerHTML = `
                        ${mediaElement}
                        <div class="ad-badge">إعلان ممول 📢</div>
                    `;
                }
            } else {
                // إذا كان الإعلان معطلاً، نجعل الشاشة شفافة ليختفي الـ WebView
                document.body.style.display = 'none';
            }
        });
    </script>
</body>
</html>
