<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* منع التحديد والتفاعل */
            user-select: none; 
            -webkit-user-select: none;
            pointer-events: none; 
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* منع سحب الصورة أو النقر عليها */
            pointer-events: none;
            -webkit-user-drag: none; 
        }
    </style>
</head>
<body oncontextmenu="return false;"> <img src="benk.jpg" alt="Ad">
</body>
</html>
