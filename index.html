<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة ذكاء FawakihAI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #007bff; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-box { height: 400px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 14px; }
        .user { background: #007bff; color: white; align-self: flex-start; }
        .ai { background: #e9ecef; color: #333; align-self: flex-end; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; margin-right: 5px; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; }
        .status { font-size: 10px; text-align: center; color: #888; padding: 5px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">اختبار مفتاح Gemini عبر GitHub</div>
    <div id="chat-box">
        <div class="message ai">مرحباً! جاري جلب الإعدادات من GitHub...</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." disabled>
        <button id="send-btn" disabled>إرسال</button>
    </div>
    <div id="status" class="status">جاري الاتصال بـ GitHub...</div>
</div>

<script>
    const GITHUB_URL = "https://raw.githubusercontent.com/yasmenjasm2-sketch/my-chat-db/refs/heads/main/ai_config.json";
    let API_KEY = "";
    
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const statusDiv = document.getElementById('status');

    // 1. جلب المفتاح من GitHub عند تحميل الصفحة
    async function fetchConfig() {
        try {
            const response = await fetch(GITHUB_URL);
            const config = await response.json();
            API_KEY = config.api_key;
            
            if (API_KEY) {
                statusDiv.innerText = "متصل بـ GitHub وجاهز للعمل ✅";
                userInput.disabled = false;
                sendBtn.disabled = false;
                appendMessage("ai", "تم جلب المفتاح بنجاح. يمكنك التحدث معي الآن!");
            }
        } catch (error) {
            statusDiv.innerText = "خطأ في جلب الإعدادات ❌";
            appendMessage("ai", "لم أتمكن من الوصول لملف GitHub. تأكد من الرابط.");
        }
    }

    // 2. دالة إرسال الرسالة لـ Gemini
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage("user", text);
        userInput.value = "";
        sendBtn.disabled = true;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${API_KEY}`;
        
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            const aiResponse = data.candidates[0].content.parts[0].text;
            appendMessage("ai", aiResponse);
        } catch (error) {
            appendMessage("ai", "حدث خطأ أثناء الاتصال بالذكاء الاصطناعي.");
        } finally {
            sendBtn.disabled = false;
        }
    }

    function appendMessage(sender, text) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.onclick = sendMessage;
    userInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

    fetchConfig();
</script>

</body>
</html>
