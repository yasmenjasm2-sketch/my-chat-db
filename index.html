<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            /* منع اللمس والتحديد نهائياً من خلال CSS */
            pointer-events: none; 
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* لجعل الصورة تتناسب مع الشاشة دون تمطيط */
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <img src="benk.jpg" alt="Advertisement">
</body>
</html>
