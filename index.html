<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Ad Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0; padding: 0; background-color: transparent; display: flex;
            justify-content: center; align-items: center; height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        .ad-container {
            position: relative; width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center; background: transparent;
            opacity: 0; animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        
        /* شريط تقدم احترافي لمدة 12 ثانية */
        .progress-bar {
            position: absolute; top: 0; left: 0; height: 3px; background: #9D4EDD;
            width: 0%; animation: loadProgress 12s linear forwards; z-index: 20;
            box-shadow: 0 0 8px #9D4EDD;
        }
        @keyframes loadProgress { to { width: 100%; } }

        img, video {
            max-width: 100%; max-height: 100%; object-fit: contain;
            pointer-events: auto; border-radius: 8px; /* حواف ناعمة للميديا */
        }
        .ad-badge {
            position: absolute; bottom: 25px; left: 20px;
            background: rgba(15, 15, 15, 0.6); backdrop-filter: blur(12px);
            color: #E0E0E0; padding: 6px 16px; border-radius: 30px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px; 
            border: 1px solid rgba(157, 78, 221, 0.4);
            pointer-events: none; z-index: 10; letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="ad-container hidden" id="adContainer">
        <!-- سيتم حقن المحتوى هنا -->
    </div>

    <script src="config.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('adContainer');

            if (typeof adConfig !== 'undefined' && adConfig.isActive) {
                container.classList.remove('hidden');
                
                let mediaElement = '';
                
                // تم إزالة خاصية muted لتشغيل الصوت مع الفيديو
                if (adConfig.type === 'video') {
                    mediaElement = `<video src="${adConfig.fileName}" autoplay loop playsinline disablepictureinpicture controlslist="nodownload"></video>`;
                } else {
                    mediaElement = `<img src="${adConfig.fileName}" alt="Ad">`;
                }

                // هيكلة الـ HTML الداخلي مع شريط التقدم
                const innerContent = `
                    <div class="progress-bar"></div>
                    ${mediaElement}
                    <div class="ad-badge">إعلان ممول 📢</div>
                `;

                if (adConfig.link && adConfig.link.trim() !== "") {
                    container.innerHTML = `
                        <a href="${adConfig.link}" target="_blank" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; text-decoration:none;">
                            ${innerContent}
                        </a>
                    `;
                } else {
                    container.innerHTML = innerContent;
                }
            } else {
                document.body.style.display = 'none';
            }
        });
    </script>
</body>
</html>
