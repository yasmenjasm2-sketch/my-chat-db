<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإعلانات</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-card { background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; outline: none; background: #2d2d2d; color: white; }
        button { width: 100%; padding: 12px; background: #9D4EDD; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background: #7b2cbf; }
        .status { margin-top: 15px; text-align: center; font-size: 14px; color: #4CAF50; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>إدارة الإعلانات ⚙️</h2>
        <label>نوع الإعلان:</label>
        <select id="adType">
            <option value="image">صورة</option>
            <option value="video">فيديو</option>
        </select>

        <label>رابط الإعلان (URL):</label>
        <input type="text" id="adUrl" placeholder="https://example.com/ad.jpg أو .mp4">

        <label>حالة الإعلان:</label>
        <select id="adStatus">
            <option value="active">مفعل</option>
            <option value="inactive">معطل (حذف الإعلان)</option>
        </select>

        <button onclick="updateAd()">تحديث الإعلان</button>
        <div class="status" id="statusMessage"></div>
    </div>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyDr0kbQDE90hhEMohV6X1b4ndu4L7uZz24",
            databaseURL: "https://mehamzaalanat-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mehamzaalanat",
            storageBucket: "mehamzaalanat.firebasestorage.app",
            appId: "1:10248497310:android:bc2b88983738827f15338f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function updateAd() {
            const type = document.getElementById('adType').value;
            const url = document.getElementById('adUrl').value;
            const status = document.getElementById('adStatus').value === 'active';

            db.ref('current_ad').set({
                type: type,
                url: url,
                isActive: status
            }).then(() => {
                document.getElementById('statusMessage').innerText = "✅ تم تحديث الإعلان بنجاح!";
                setTimeout(() => document.getElementById('statusMessage').innerText = "", 3000);
            }).catch((error) => {
                document.getElementById('statusMessage').innerText = "❌ خطأ: " + error.message;
                document.getElementById('statusMessage').style.color = "red";
            });
        }
    </script>
</body>
</html>
